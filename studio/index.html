<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Studio — Sharif Adornment</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f3ee" />
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("sa-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {}
  </script>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="studio.css" />
</head>
<body>
  <!-- Password -->
  <section class="gate" data-lock hidden>
    <form class="gate__card" data-unlock>
      <p class="eyebrow">Sharif Adornment</p>
      <h1>Studio</h1>
      <p class="muted">Enter the Studio password to edit the site.</p>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required autofocus />
      </label>
      <button class="btn btn--block" type="submit">Enter</button>
      <p class="gate__error" data-unlock-error role="alert"></p>
    </form>
  </section>

  <!-- Studio -->
  <div class="app" data-app hidden>
    <header class="bar">
      <a class="bar__brand" href="../index.html" target="_blank" rel="noopener"><span class="caps">SHARIF</span> Adornment <em>Studio</em></a>
      <div class="bar__tools">
        <a class="bar__link bar__link--site" href="../index.html" target="_blank" rel="noopener">View site ↗</a>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle night mode" title="Night mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <button class="bar__link" data-signout>Sign out</button>
      </div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="pieces" aria-selected="true">Pieces</button>
      <button role="tab" data-tab="orders">Orders</button>
      <button role="tab" data-tab="collections">Collections</button>
      <button role="tab" data-tab="bridal">Bridal</button>
      <button role="tab" data-tab="reviews">Reviews</button>
      <button role="tab" data-tab="faq">FAQ</button>
      <button role="tab" data-tab="pages">Pages</button>
      <button role="tab" data-tab="gallery">Gallery</button>
      <button role="tab" data-tab="shop">Shop</button>
      <button role="tab" data-tab="stats">Analytics</button>
      <button role="tab" data-tab="history">History</button>
      <button role="tab" data-tab="details">Details</button>
    </nav>
    <main class="view" data-view></main>

    <div class="publish" data-publish>
      <span class="publish__status" data-status>All changes published</span>
      <button class="btn btn--ghost" data-preview-btn title="See your changes on the real site before publishing">Preview</button>
      <button class="btn btn--ghost" data-discard hidden>Discard</button>
      <button class="btn" data-publish-btn disabled>Publish</button>
    </div>
  </div>

  <dialog class="editor" data-editor></dialog>
  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script src="studio.js" defer></script>
</body>
</html>
